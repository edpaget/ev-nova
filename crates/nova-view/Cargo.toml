[package]
name = "nova-view"
description = "Renderer-free draw lists, input events and the screen trait for EV Nova"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The game data the screens show, read through each screen's own port.
nova-data.workspace = true
# Resource type codes, for the developer tools' resource catalog.
nova-rsrc.workspace = true
# The view vocabulary: the flight port's frame, commands, events and
# screen asks, the view models and the session's value types.
nova-sim-frame.workspace = true
# The fake catalog's (`flight::fake_catalog`, under `fixture`) record
# fields: the catalog layer's control expressions, voices, buoy strings
# and listed stellars, and the foundation's ship fields.
nova-sim-catalog = { workspace = true, optional = true }
nova-sim-base = { workspace = true, optional = true }
# The physical key names `Key` is.
keyboard-types.workspace = true

[dev-dependencies]
# Synthetic sprite sheets for the GameData adapter tests.
nova-data = { workspace = true, features = ["fixture"] }
# Synthetic resource forks for in-memory stores.
nova-rsrc = { workspace = true, features = ["fixture"] }
# The developer tools' record view is checked by parsing its JSON.
serde_json.workspace = true
# The saved nav's builder (`SavedNav::of`) for the fake's map nav.
nova-sim-frame = { workspace = true, features = ["fixture"] }
# The chance port's contract (`fixture::chance::check_contract`).
nova-sim-base = { workspace = true, features = ["fixture"] }
# The fake catalogs' listed stellars (`fixture::listed_stellars`).
nova-sim-catalog = { workspace = true, features = ["fixture"] }
# The state layer's view types the tests build that the frame doesn't
# carry (`shown::board::AmmoOffer`, `trade_dialog::TradeWords`, ...).
nova-sim-state.workspace = true

[features]
# Exposes the text-metrics mock, the port's contract, the flight-sim fake
# and its contract, the movie-player mock and its contract
# (`movie::fixture`), the empty dialog source (`ui::catalog::fixture`),
# the main screen's fixture art (built with
# nova-data's and nova-rsrc's fixture builders) and the flight's fake
# catalog (`flight::fake_catalog`) to other crates' tests,
# nova-view-it's among them.
# The fake's scripted map nav is built with nova-sim-frame's fixture
# (`SavedNav::of`), and the fake catalog's records with nova-sim-catalog's
# and nova-sim-base's. nova-view never depends on nova-sim: the adapter
# over a real `Session` is nova-flight's.
fixture = [
    "nova-data/fixture",
    "nova-rsrc/fixture",
    "nova-sim-frame/fixture",
    "dep:nova-sim-catalog",
    "nova-sim-catalog/fixture",
    "dep:nova-sim-base",
]

[lints]
workspace = true
