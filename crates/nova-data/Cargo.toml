[package]
name = "nova-data"
description = "Typed EV Nova game records (ships, missions, systems, ...) decoded from resources"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
binrw.workspace = true
encoding_rs.workspace = true
# The new game's data format: its loader, read by the `new_game` adapter.
nova-galaxy-format.workspace = true
# The new game's media: its models read and drawn from above, the
# stand-ins the store keeps for records with no sprite.
nova-galaxy-media.workspace = true
nova-rsrc.workspace = true
serde.workspace = true
# `AnyRecord::to_json`: a record's fields as JSON, for nova-dump and the
# developer tools' record view.
serde_json.workspace = true
thiserror.workspace = true
# `check_sfnt` parses Charcoal as the renderer's font stack (fontdb,
# cosmic-text) will, so a font it cannot use is reported, not silently
# replaced.
ttf-parser.workspace = true

[dev-dependencies]
encoding_rs.workspace = true
# The format's small test galaxy (`fixture::galaxy`), broken one file at a
# time by the adapter's tests.
nova-galaxy-format = { workspace = true, features = ["fixture"] }
# Synthetic forks for the decode-file and wiring tests.
nova-rsrc = { workspace = true, features = ["fixture"] }
# Integration tests build synthetic pictures, sprites and sounds with the
# `fixture` builders.
nova-data = { workspace = true, features = ["fixture"] }
# Real folders for the directory-listing adapter and store wiring tests.
tempfile.workspace = true

[features]
# Exposes to other crates' tests the synthetic picture, sprite and sound
# builders; the store's shared fake (`store::fixture::FakeTree`, over
# nova-rsrc's `MemForks`) with the `DirLister` port's `check_contract` and
# the one-file stores (`one_file`, `store_of`); and the `shän`/`shïp` byte
# builders (`records::fixture`); and the new game's checked-in folder
# (`new_game::fixture::folder`).
fixture = ["nova-rsrc/fixture"]

[lints]
workspace = true
