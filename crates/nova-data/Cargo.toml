[package]
name = "nova-data"
description = "Typed EV Nova game records (ships, missions, systems, ...) decoded from resources"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
binrw.workspace = true
encoding_rs.workspace = true
nova-rsrc.workspace = true
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
encoding_rs.workspace = true
# Synthetic forks for the decode-file and wiring tests.
nova-rsrc = { workspace = true, features = ["fixture"] }
# Integration tests build synthetic pictures and sprites with the `fixture`
# builders.
nova-data = { workspace = true, features = ["fixture"] }
serde_json.workspace = true

[features]
# Exposes the synthetic picture and sprite builders to other crates' tests.
fixture = []

[lints]
workspace = true
