[package]
name = "nova-bundle"
description = "Packs the nightly's installers: Nova.app, the Apple silicon macOS bundle, into a .dmg (Developer ID signed and notarized, or ad-hoc signed), the built Windows executables into a per-user MSI, the Linux desktop file, AppStream metainfo and icons into a share/ tree, and the game into a Linux AppImage and Flatpak"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# `mise run bundle` runs `cargo run -p nova-bundle`; nova-installer,
# nova-linux, nova-appimage and nova-flatpak are the other binaries.
default-run = "nova-bundle"

[dependencies]
# The signing variables' certificate and API key.
base64.workspace = true
# Info.plist, written as XML.
plist.workspace = true
# `cargo metadata`'s output, read into the bundle's spec.
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The Windows installer's icon and version, as nova.exe's resources have
# them.
nova-winres.workspace = true

[dev-dependencies]
# Reads the generated WiX source back as XML in the tests.
roxmltree.workspace = true
# Real folders for the std adapters' tests.
tempfile.workspace = true

[lints]
workspace = true
