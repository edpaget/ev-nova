[package]
name = "nova"
description = "EV Nova engine and player"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Sound effects and music: the core the app feeds, and the kira adapter
# `main` opens.
nova-audio.workspace = true
nova-data.workspace = true
nova-render.workspace = true
# The pilot store port the filesystem adapter implements, and the keeper
# the router saves pilots through.
nova-sim.workspace = true
nova-view.workspace = true
pollster.workspace = true
# The settings file's format: JSON, through a private record.
serde.workspace = true
# The settings file's `rules` and `rule_overrides`, read beside the sound
# settings.
serde_json.workspace = true
thiserror.workspace = true
winit.workspace = true
# The developer tools overlay, only with the `dev-tools` feature.
egui = { workspace = true, optional = true }
egui-wgpu = { workspace = true, optional = true }
egui-winit = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }

# The macOS menu bar, built behind nova-appkit's safe API.
[target.'cfg(target_os = "macos")'.dependencies]
nova-appkit.workspace = true

# The open panel and the alerts startup shows when nobody reads stderr,
# from rfd: on macOS `NSOpenPanel` and `NSAlert`s, on Windows a folder
# picker and `MessageBoxW`s, on Linux the XDG file-chooser portal (zenity
# without it) and zenity's alerts.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
rfd.workspace = true

# rfd's Linux backend: the FileChooser portal over a `dlopen`ed libdbus,
# falling back to zenity, with no GTK or Wayland crates. Turned on here, for
# Linux only, so the macOS and Windows builds keep their feature sets.
[target.'cfg(target_os = "linux")'.dependencies]
rfd = { workspace = true, features = ["xdg-portal"] }

# The console calls behind nova-win32's safe API: attaching to the
# terminal's console, as `nova.exe` is a Windows-subsystem program; and
# the icon's resource id, which the window loads its icon by.
[target.'cfg(windows)'.dependencies]
nova-win32.workspace = true
nova-winres.workspace = true

# `build.rs`: nova.exe's icon, version information and manifest, made by
# nova-winres and compiled by embed-resource, for Windows targets only.
[build-dependencies]
embed-resource.workspace = true
nova-winres.workspace = true

[dev-dependencies]
# The app and integration tests record Audio commands with the `recording`
# mock.
nova-audio = { workspace = true, features = ["recording"] }
# Synthetic sprite sheets and pictures for the screen router and app tests.
nova-data = { workspace = true, features = ["fixture"] }
# The app tests record Gpu calls with the `recording` mock.
nova-render = { workspace = true, features = ["recording"] }
# Synthetic resource forks for in-memory stores.
nova-rsrc = { workspace = true, features = ["fixture"] }
# The text-metrics mock for the router's dialog tests.
nova-view = { workspace = true, features = ["fixture"] }
# The router and integration tests save pilots in the in-memory store.
nova-sim = { workspace = true, features = ["fixture"] }
# The pilot file adapter's tests write into a temporary directory.
tempfile.workspace = true
# The runner tests build the wgpu errors a GPU set-up can fail with.
wgpu.workspace = true

# The Windows-only tests of the built nova.exe read its PE structures.
[target.'cfg(windows)'.dev-dependencies]
object.workspace = true

[features]
# The developer tools overlay (egui), toggled with the backquote key. Off by
# default and in release builds; `mise run dev` turns it on.
dev-tools = ["dep:egui", "dep:egui-wgpu", "dep:egui-winit", "dep:wgpu"]

[lints]
workspace = true

# The game's identity, which nova-bundle reads through `cargo metadata` into
# Nova.app's Info.plist, the Windows installer, and the Linux desktop file
# and AppStream metainfo (the version is this package's). The bundle file is
# `Nova.app`, so it never replaces an `EV Nova.app` (the original game) in
# /Applications, but the app menu and Finder name it `name`.
#
# `identifier` is also the window's Wayland app id and X11 WM_CLASS, which
# build.rs reads from here (`nova::platform::APP_ID`), so the desktop file
# named after it matches the running window.
[package.metadata.bundle]
identifier = "io.github.edpaget.ev-nova"
name = "EV Nova"
category = "public.app-category.role-playing-games"
summary = "Play EV Nova from your own copy of its data"
description = "A new engine for the space trading and combat game EV Nova. It plays the game from your own copy of its data files, which are not included."
homepage = "https://github.com/edpaget/ev-nova"
developer = "ev-nova contributors"
# update_public_key = "<base64 Ed25519 public key>": set by the operator once
# the signing key exists (infra/github/README.md, "The update-signing
# environment"). Without it, publish writes no update feeds.
