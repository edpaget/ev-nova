[package]
name = "nova"
description = "EV Nova engine and player"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Sound effects and music: the core the app feeds, and the kira adapter
# `main` opens.
nova-audio.workspace = true
nova-data.workspace = true
nova-render.workspace = true
# The pilot store port the filesystem adapter implements, and the keeper
# the router saves pilots through.
nova-sim.workspace = true
nova-view.workspace = true
pollster.workspace = true
# The settings file's `rules` and `rule_overrides`, read beside the sound
# settings.
serde_json.workspace = true
thiserror.workspace = true
winit.workspace = true
# The developer tools overlay, only with the `dev-tools` feature.
egui = { workspace = true, optional = true }
egui-wgpu = { workspace = true, optional = true }
egui-winit = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }

[dev-dependencies]
# The app and integration tests record Audio commands with the `recording`
# mock.
nova-audio = { workspace = true, features = ["recording"] }
# Synthetic sprite sheets and pictures for the screen router and app tests.
nova-data = { workspace = true, features = ["fixture"] }
# The app tests record Gpu calls with the `recording` mock.
nova-render = { workspace = true, features = ["recording"] }
# Synthetic resource forks for in-memory stores.
nova-rsrc = { workspace = true, features = ["fixture"] }
# The text-metrics mock for the router's dialog tests.
nova-view = { workspace = true, features = ["fixture"] }
# The router and integration tests save pilots in the in-memory store.
nova-sim = { workspace = true, features = ["fixture"] }
# The pilot file adapter's tests write into a temporary directory.
tempfile.workspace = true
# The runner tests build the wgpu errors a GPU set-up can fail with.
wgpu.workspace = true

[features]
# The developer tools overlay (egui), toggled with the backquote key. Off by
# default and in release builds; `mise run dev` turns it on.
dev-tools = ["dep:egui", "dep:egui-wgpu", "dep:egui-winit", "dep:wgpu"]

[lints]
workspace = true
