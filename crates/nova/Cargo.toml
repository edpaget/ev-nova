[package]
name = "nova"
description = "EV Nova engine and player"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nova-data.workspace = true
nova-render.workspace = true
nova-rsrc.workspace = true
nova-view.workspace = true
pollster.workspace = true
thiserror.workspace = true
winit.workspace = true

[dev-dependencies]
# Synthetic pictures and sprites for the placeholder's content tests.
nova-data = { workspace = true, features = ["fixture"] }
# The app tests record Gpu calls with the `recording` mock.
nova-render = { workspace = true, features = ["recording"] }
# Synthetic resource forks for in-memory stores.
nova-rsrc = { workspace = true, features = ["fixture"] }
# The runner tests build the wgpu errors a GPU set-up can fail with.
wgpu.workspace = true

[lints]
workspace = true
