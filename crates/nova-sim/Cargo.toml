[package]
name = "nova-sim"
description = "EV Nova's game state and rules, headless: no rendering, windowing or audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The chär and shïp records a flight session starts from, read through the
# sim's own port.
nova-data.workspace = true
# The save schema: JSON, through private records.
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The foundation of the layered nova-sim crates, re-exported at its old
# paths (`nova_sim::rulebook`, `nova_sim::Vec2`, ...).
nova-sim-base.workspace = true
# The catalog layer, on the foundation: the typed view of the game data and its
# GameData adapter, control bits, sounds, strings and the warp clock,
# re-exported at their old paths (`nova_sim::catalog`, ...).
nova-sim-catalog.workspace = true

[dev-dependencies]
# Synthetic resource forks for the GameData adapter tests under `tests/`.
nova-data = { workspace = true, features = ["fixture"] }
nova-rsrc = { workspace = true, features = ["fixture"] }
# The scripted `Chance` (`Scripted`) the unit tests draw on.
nova-sim-base = { workspace = true, features = ["fixture"] }
# The catalog's record builders and control-bit mocks, which `testkit`
# re-exports.
nova-sim-catalog = { workspace = true, features = ["fixture"] }
# This crate's own `fixture` module, for its integration tests under
# `tests/`, which build the library without `cfg(test)`: the storyline
# walker the stock tests drive.
nova-sim = { workspace = true, features = ["fixture"] }

[features]
# Exposes the test support in `fixture` (the in-memory pilot store and the
# storyline walker) to other crates' tests and this crate's `tests/`.
fixture = []

[lints]
workspace = true
