[package]
name = "nova-rsrc"
description = "Reader for classic Mac OS resource forks (flattened .ndat / .rsrc files) and Windows .rez resource files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
encoding_rs.workspace = true

[dev-dependencies]
macbinary.workspace = true
# Integration tests build synthetic forks with the `fixture` builder.
nova-rsrc = { workspace = true, features = ["fixture"] }
tempfile.workspace = true

[features]
# Exposes the synthetic resource-fork and .rez builders to other crates' tests.
fixture = []

[lints]
workspace = true
