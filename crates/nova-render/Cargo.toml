[package]
name = "nova-render"
description = "Sprite, picture, text and primitive renderer for EV Nova draw lists"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bytemuck.workspace = true
glyphon.workspace = true
nova-data.workspace = true
nova-view.workspace = true
pollster.workspace = true
thiserror.workspace = true
wgpu.workspace = true

[dev-dependencies]
# Synthetic pictures and sprites for the GameData source tests, and the
# block font for the text tests.
nova-data = { workspace = true, features = ["fixture"] }
# Synthetic resource forks for in-memory stores.
nova-rsrc = { workspace = true, features = ["fixture"] }
# The text-metrics port's contract, for the glyphon adapter's tests.
nova-view = { workspace = true, features = ["fixture"] }
# Integration tests record Gpu calls with the `recording` mock.
nova-render = { workspace = true, features = ["recording"] }

[features]
# Exposes the recording Gpu mock to other crates' tests.
recording = []

[lints]
workspace = true
