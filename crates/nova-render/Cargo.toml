[package]
name = "nova-render"
description = "Sprite, picture, text and primitive renderer for EV Nova draw lists"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bytemuck.workspace = true
glyphon.workspace = true
nova-data.workspace = true
# The new game's asset manifest, budgets and media, and its glTF models
# read as data, for the `ModelSource` adapter (`galaxy_models`).
nova-galaxy-format.workspace = true
nova-galaxy-media.workspace = true
nova-view.workspace = true
pollster.workspace = true
skrifa.workspace = true
thiserror.workspace = true
wgpu.workspace = true
zeno.workspace = true

# The MetalFX world upscaler's FFI, macOS only: no other build links it.
[target.'cfg(target_os = "macos")'.dependencies]
nova-metalfx.workspace = true

[dev-dependencies]
# Synthetic pictures and sprites for the GameData source tests, and the
# block font for the text tests.
nova-data = { workspace = true, features = ["fixture"] }
# The format's test galaxy and test models built in code, for the model
# adapter's tests.
nova-galaxy-format = { workspace = true, features = ["fixture"] }
nova-galaxy-media = { workspace = true, features = ["fixture"] }
# Synthetic resource forks for in-memory stores.
nova-rsrc = { workspace = true, features = ["fixture"] }
# The text-metrics port's contract, for the glyphon adapter's tests.
nova-view = { workspace = true, features = ["fixture"] }
# Integration tests record Gpu calls with the `recording` mock.
nova-render = { workspace = true, features = ["recording"] }

[features]
# Exposes the test support in `recording` (the recording Gpu mock and the
# empty `NoImages` source), and the model source port's fake and contract
# check (`model_source::{FakeModels, check_contract}`), to other crates'
# tests.
recording = []

[lints]
workspace = true
