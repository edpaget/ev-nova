[package]
name = "nova-dump"
description = "Writes EV Nova game data out as JSON, PNG and WAV files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nova-data.workspace = true
nova-rsrc.workspace = true
png.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Synthetic pictures, sprites and sounds for the encoder and export tests.
nova-data = { workspace = true, features = ["fixture"] }
# Synthetic resource forks for in-memory stores.
nova-rsrc = { workspace = true, features = ["fixture"] }

[lints]
workspace = true
