[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
nova-rsrc = { path = "crates/nova-rsrc" }
nova-data = { path = "crates/nova-data" }
nova-view = { path = "crates/nova-view" }
nova-render = { path = "crates/nova-render" }
nova-metalfx = { path = "crates/nova-metalfx" }
nova-appkit = { path = "crates/nova-appkit" }
nova-win32 = { path = "crates/nova-win32" }
nova-winres = { path = "crates/nova-winres" }
nova-sim = { path = "crates/nova-sim" }
nova-sim-base = { path = "crates/nova-sim-base" }
nova-sim-catalog = { path = "crates/nova-sim-catalog" }
nova-sim-state = { path = "crates/nova-sim-state" }
nova-sim-combat = { path = "crates/nova-sim-combat" }
nova-sim-ai = { path = "crates/nova-sim-ai" }
nova-sim-story = { path = "crates/nova-sim-story" }
nova-sim-port = { path = "crates/nova-sim-port" }
nova-audio = { path = "crates/nova-audio" }
encoding_rs = "0.8"
macbinary = "0.2.1"
png = "0.18"
# nova-bundle writes Nova.app's Info.plist with it, and its tests read the
# plist back. Its default `serde` feature is not needed.
plist = { version = "1.10.1", default-features = false }
tempfile = "3"
# Compiles nova.exe's resource script (its icon, version information and
# manifest) on Windows; for any other target it does nothing.
embed-resource = "3.0.12"
# Reads the PE nova.exe's tests check, as structures.
object = { version = "0.37.3", default-features = false, features = ["read_core", "pe", "std"] }
# Reads the Windows manifest back as XML in nova-winres's and nova's tests,
# and the installer's WiX source in nova-bundle's.
roxmltree = "0.20.0"
# nova-bundle decodes the Developer ID certificate and the notary API key
# from base64 signing variables; the version plist already locks.
base64 = "0.23"
# nova-bundle signs the update feeds' installers with Ed25519, as Sparkle's
# and WinSparkle's `sparkle:edSignature` expects.
ed25519-dalek = "2.2"
binrw = "0.15"
serde = { version = "1", features = ["derive"] }
# nova's build script reads its own Cargo.toml (nova-winres).
toml = "1"
serde_json = "1"
thiserror = "2"
# Reads the synthetic test fonts back in nova-data's fixture tests; the
# version glyphon's font stack already locks.
ttf-parser = "0.25.1"
# Rendering and windowing. glyphon 0.12 is built on wgpu 30, so the two move
# together.
wgpu = "30.0.1"
glyphon = "0.12.0"
winit = "0.30.13"
pollster = "1.0.1"
# The open panel that asks for the Nova Files and the startup alerts
# (nova's dependency on macOS, Windows and Linux). Its default features are
# Linux's portal and Wayland backends: nova turns `xdg-portal` back on for
# Linux alone, and leaves `wayland` off, as the picker runs before any
# window exists. Without `common-controls-v6` its Windows alerts are plain
# `MessageBoxW`s.
rfd = { version = "0.17.2", default-features = false }
bytemuck = { version = "1.25", features = ["derive"] }
# The developer tools overlay (nova's `dev-tools` feature only). egui-wgpu
# 0.36 is built on wgpu 30 and egui-winit 0.36 on winit 0.30, so the three
# move with wgpu and winit, as glyphon does. Their default features (WebGL,
# the clipboard, web links, Wayland and X11 forwarding) are not needed.
egui = "0.36.2"
egui-wgpu = { version = "0.36.2", default-features = false }
egui-winit = { version = "0.36.2", default-features = false }
# Sound effects and music (nova-audio's adapter): the cpal device backend
# and the MP3 decoder for the soundtrack. The default features' realtime
# thread priority (and its dbus dependency) and the other formats are not
# needed.
kira = { version = "0.12.5", default-features = false, features = ["cpal", "mp3"] }

# Line tables only in dev and test builds: backtraces keep their files and
# lines, but debuggers lose local variables. It cuts a cold build by about a
# fifth and halves `target/`, which slows the growth of `target/debug/deps`
# behind the wgpu test timeouts.
[profile.dev]
debug = "line-tables-only"

# cargo-mutants builds every mutant with this profile (`.cargo/mutants.toml`):
# no debug info at all, as a mutant's build is never debugged.
[profile.mutants]
inherits = "test"
debug = "none"

# The PNG encoder and its compression and checksum crates run tens of
# times slower unoptimised, and nova-dump's stock test (a debug build)
# encodes about a thousand images: optimise just them in dev and test
# builds.
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.simd-adler32]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.adler2]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that are noise for this codebase: decoding big-endian binary
# formats and pixel data is full of deliberate integer casts.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Restriction lints worth having.
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
