[tools]
rust = { version = "1.98.1", components = "rustfmt,clippy" }
"cargo:cargo-workspaces" = "0.4.2"
"cargo:cargo-nextest" = "0.9.146"
"cargo:cargo-mutants" = "27.1.0"
"cargo:cargo-deny" = "0.19.9"
hk = "2.4.0"
pkl = "0.32.1"
# infra/github's config (the infra-* tasks); CI installs it only in the infra job.
opentofu = "1.13.2"

[env]
RDM_ROOT = "{{env.HOME | default(value=env.USERPROFILE | default(value=''))}}/Projects/rdm-atlas-repo"
RDM_PROJECT = "ev-nova"
# Build and test four mutants at once: a mutant's build is mostly one crate
# and its links, which leaves most of the 18 cores idle at two. A flag passed
# after `--` (`-j`) still wins.
CARGO_MUTANTS_JOBS = "4"

[tasks.fmt]
description = "Check formatting"
run = "cargo fmt --all --check"

[tasks.lint]
description = "Clippy over every crate and target, warnings are errors"
run = "cargo clippy --workspace --all-targets --locked -- -D warnings"

[tasks.deny]
description = "cargo-deny's bans over the default build's dependency graph (deny.toml)"
run = "cargo deny --locked check bans"

[tasks.doc]
description = "Rustdoc over every crate, private items included, with broken intra-doc links denied"
env = { RUSTDOCFLAGS = "-D rustdoc::broken_intra_doc_links" }
run = "cargo doc --workspace --no-deps --document-private-items --locked"

# Not in `ci`: CI's own Windows leg lints natively. Needs
# `rustup target add x86_64-pc-windows-msvc`; its own target directory keeps
# the host build warm.
[tasks.lint-windows]
description = "Clippy over every crate and target for Windows (x86_64-pc-windows-msvc), from any host, warnings are errors"
run = "cargo clippy --workspace --all-targets --target x86_64-pc-windows-msvc --target-dir target/windows --locked -- -D warnings"

[tasks.lint-lib]
description = "Clippy over every crate's libs and bins without dev-dependency features (so no `fixture`), warnings are errors"
run = "cargo clippy --workspace --locked -- -D warnings"

[tasks.test]
description = "Unit/integration tests (nextest) plus doctests"
run = [
  "cargo nextest run --workspace --locked --no-tests=pass",
  "cargo test --doc --workspace --locked",
]

# The dev-tools tasks build nova with the `dev-tools` feature (egui) into
# their own target directories, so the default build in `target/debug` is
# never rebuilt with egui, and its cache never thrashed, by a parallel task
# or a running viewer.
[tasks.lint-dev-tools]
description = "Clippy over nova with the dev-tools feature, warnings are errors"
run = "cargo clippy -p nova --all-targets --features dev-tools --target-dir target/dev-tools --locked -- -D warnings"

[tasks.test-dev-tools]
description = "nova's tests with the dev-tools feature (nextest)"
run = "cargo nextest run -p nova --features dev-tools --target-dir target/dev-tools --locked --no-tests=pass"

[tasks.dev]
description = "Run the viewer with the developer tools; backquote (`) shows and hides them. Pass the Nova Files folder after --, or set NOVA_DATA"
run = "cargo run -p nova --features dev-tools --target-dir target/dev-run --locked --"

[tasks.bundle]
description = "macOS only: build Nova.app (Apple silicon) into ev-nova-aarch64-apple-darwin.dmg, Developer ID signed and notarized when the MACOS_*/APPLE_* signing variables are set, ad-hoc otherwise; pass an output dir after -- (default target/bundle/out)"
run = "cargo run -p nova-bundle --locked --"

[tasks.mutants]
description = "Mutation testing (cargo-mutants); pass extra flags after --, e.g. -- --file <path>"
run = "cargo mutants --workspace"

[tasks.ci]
description = "Everything CI would run; `hk check` runs this, and it gates review and landing"
depends = ["fmt", "lint", "lint-lib", "deny", "doc", "test", "lint-dev-tools", "test-dev-tools"]

# OpenTofu over infra/github, the repository's GitHub settings (README.md
# there). infra-plan and infra-apply act on the live repository with the
# operator's `gh` token and 1Password, so they are never part of `ci` or the
# hk hooks. infra-check needs no credentials and is the one exception to
# "verification runs through cargo": cargo can't test HCL, and a Rust wrapper
# would need tofu and the network, which would break hermetic tests. It runs
# only here and in CI's `infra` job, never in `ci` or hk.
# Even `tofu init` evaluates the encryption block, so it needs the passphrase
# and runs inside the same `op run` as plan/apply: one 1Password approval for
# the passphrase per run, not two.
[tasks.infra-plan]
description = "Plan infra/github against the LIVE repository (gh token, 1Password approvals); kept out of ci and hk on purpose"
run = "GITHUB_TOKEN=$(gh auth token) op run --env-file=infra/github/op.env -- sh -c 'tofu -chdir=infra/github init -input=false -lockfile=readonly && tofu -chdir=infra/github plan'"

[tasks.infra-apply]
description = "Apply infra/github to the LIVE repository, interactively (gh token, 1Password approvals); kept out of ci and hk on purpose"
run = "GITHUB_TOKEN=$(gh auth token) op run --env-file=infra/github/op.env -- sh -c 'tofu -chdir=infra/github init -input=false -lockfile=readonly && tofu -chdir=infra/github apply'"

[tasks.infra-check]
description = "fmt, validate and mocked-provider tests for infra/github, with no credentials. The one non-cargo check: cargo can't test HCL, and a Rust wrapper would need tofu and the network (not hermetic). Runs only here and in CI's infra job, never in ci or hk"
# Evaluating the encryption block needs some passphrase. No state exists
# where this runs, so the value protects nothing.
env = { TF_VAR_state_passphrase = "check-only-not-a-secret" }
run = [
  "tofu -chdir=infra/github fmt -check -recursive",
  "tofu -chdir=infra/github init -backend=false -input=false -lockfile=readonly",
  "tofu -chdir=infra/github validate",
  "tofu -chdir=infra/github test",
]
