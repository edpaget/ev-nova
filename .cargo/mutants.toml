# Run each mutant's tests with nextest, like `mise run test`.
test_tool = "nextest"
# Crates with no tests yet must not fail the unmutated baseline run.
additional_cargo_test_args = ["--no-tests=pass"]
# Build and test every mutant with all of its package's features on, so
# nova's mutants compile and test the `dev-tools` glue (egui). Each mutant
# is built and tested with `--package <its package>` alone, and
# `--all-features` is valid for every package, whereas `--features
# nova/dev-tools` is rejected for any package but nova, which cargo-mutants
# then marks unviable and never tests (checked on a scratch two-member
# workspace). The other features (`fixture`, `recording`) only expose test
# helpers that the packages' own tests turn on anyway. With `dev-tools` on,
# `tests/default_build_links_no_egui.rs` is compiled out and its positive
# control runs instead.
additional_cargo_args = ["--all-features"]

exclude_re = [
    # The shipyard's trade-in leaves out outfits flagged persistent (0x0004)
    # or unsellable (0x0008): two distinct bits, so `|` and `^` combine them
    # the same.
    "replace \\| with \\^ in trade_in",
    # Compiled only on non-macOS targets, so on the macOS development host a
    # mutated body is never built into the tests and cannot be observed. It
    # is a one-line `Ok(None)`.
    "no_resource_fork",
    # nova's `main` only wires the real adapters together and runs the event
    # loop, which needs a display; `cli::data_dir` and the app it starts are
    # tested on their own.
    "replace main -> ExitCode",
    # The winit event-loop glue: opening the window and its surface (or
    # recording why it could not), and forwarding each event to
    # `App::handle` (including acting on its `Control`). It needs a real
    # window and display. The decisions it forwards to (`translate`,
    # `App::handle`, `gpu_failure`, `exit::exit`) are mutated and tested.
    "impl ApplicationHandler for Runner<S>>::(resumed|window_event)",
    # The developer tools' window glue (the `dev-tools` feature): egui-winit's
    # input state over a real winit window, which tests cannot build. Each
    # forwards to tested parts: the panel (`DevPanel`), the painter
    # (`EguiLayer`) and the app's routing (`App::overlay_wants`).
    "DevTools::(new|on_window_event|run_frame|layer_mut)",
    # The window port over a real winit window: one-line reads of its size
    # and scale factor and a redraw request, observable only with a window.
    "impl WindowPort for WinitWindow>::(size_px|scale_factor|request_redraw)",
    # winit's `KeyEvent` and `ScaleFactorChanged` have private fields, so
    # tests cannot build these events. Each arm only delegates (to the
    # tested `key_event`, or reads the window port).
    "delete match arm WinitEvent::(KeyboardInput|ScaleFactorChanged)\\{.*\\} in translate",
    # The surface adapter's raw calls, as whole bodies only: pages and
    # uploads delegate to `WgpuRenderer` (tested offscreen), and `submit`
    # is the raw configure / get_current_texture / present calls on a
    # window surface, which needs a display. Its decisions are the tested
    # `surface_action` and `acquire_outcome`; any other mutant inside these
    # bodies is still run.
    "replace <impl Gpu for SurfaceGpu>::(create_page|upload|submit) with \\(\\)$",
    # The same raw surface calls, now in `SurfaceGpu::present`, which
    # `submit` and the overlay's `submit_with` call (with a painter or
    # without): replacing either body is observable only on a window
    # surface. `OffscreenGpu`'s twin of each is mutated and tested.
    "replace (SurfaceGpu::present|<impl OverlayGpu for SurfaceGpu>::submit_with) with \\(\\)$",
    # The one-line edge that opens the default audio device through cpal
    # and hands it to `KiraAudio::with_manager`. Running it needs a real
    # output device, which no gating test may open; everything it hands
    # on to is mutated and tested on kira's device-free `MockBackend`.
    "KiraAudio::open",
    # The trait's default `take_warnings` and `take_diagnostics` are
    # `Vec::new()`; replacing either with `vec![]` builds the same empty
    # list, so it cannot be observed.
    "replace Screen::take_warnings -> Vec<String> with vec!\\[\\]",
    "replace Screen::take_diagnostics -> Vec<Diagnostic> with vec!\\[\\]",
    # `Behaviour::trigger`'s default body is `Trigger::default()`, the
    # "never fires" command; replacing it with `Default::default()` builds
    # the same value, so it cannot be observed.
    "replace Behaviour::trigger -> Trigger with Default::default\\(\\)",
    # `Behaviour::target`'s default body is `None`, "targets nothing";
    # replacing it with `None` builds the same value, so it cannot be
    # observed.
    "replace Behaviour::target -> Option<ShipRef> with None",
    # `Behaviour::react`'s default body is `Reaction::default()`, "no
    # answer"; replacing it with `Default::default()` builds the same
    # value, so it cannot be observed.
    "replace Behaviour::react -> Reaction with Default::default\\(\\)",
    # A hail's mood is an f32 compared as an f64 against 0.8 and 1.2,
    # neither of which any f32 widens to exactly, so `<` and `<=` (and `>`
    # and `>=`) give the same answer for every mood.
    "replace (<|>) with (<=|>=) in Mood::of",
    # A repair's loop is bounded by the points up to the armour's most only
    # so it always ends; a larger bound changes nothing, as the loop stops
    # once the player flies and the armour is held at its most.
    "replace - with \\+ in repair",
    # The autopilot closes on a point with a margin of none only for an
    # escort approaching its slot, which it does only while more than
    # `KEEP_FORMATION` off it; a follower exactly at its margin closes at a
    # braking speed of none. So no distance the autopilot meets tells `>`
    # from `>=` in the closing speed's guard.
    "replace > with >= in close_on",
    # wgpu usage flags are disjoint bits, so `A | B` and `A ^ B` are the
    # same value: these mutants cannot change behaviour.
    "replace \\| with \\^ in (OffscreenGpu::read_pixels|WgpuRenderer::create_page)",
]
