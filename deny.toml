# cargo-deny's `bans` check (`mise run deny`) over the dependency graph that
# the default features resolve: what a release build links, read from Cargo's
# resolver rather than from any binary.
[graph]
all-features = false
no-default-features = false

[bans]
# Only the crates denied below matter here; duplicate versions are fine.
multiple-versions = "allow"
deny = [
    # The developer tools overlay is opt-in (nova's `dev-tools` feature):
    # egui must never be in the default build.
    { crate = "egui", reason = "only nova's dev-tools feature may pull in egui" },
    { crate = "egui-wgpu", reason = "only nova's dev-tools feature may pull in egui" },
    { crate = "egui-winit", reason = "only nova's dev-tools feature may pull in egui" },
    # The layered nova-sim crates (roadmap nova-sim-layered-crates). Each
    # entry's `wrappers` lists the only crates allowed to depend on it
    # directly: the nova-sim crates above it (and, for the nova-sim facade,
    # its downstream crates and its own `fixture` dev-dependency). A lower
    # crate is never in a higher crate's list, so it can't depend on it,
    # not even as a dev-dependency, which Cargo itself allows. A new
    # layered crate gets its own entry and is added to the `wrappers` of
    # every crate below it.
    { crate = "nova-sim", wrappers = ["nova", "nova-sim", "nova-view"], reason = "a layered nova-sim crate must never depend on the facade above it" },
    { crate = "nova-sim-base", wrappers = ["nova-sim", "nova-sim-catalog", "nova-sim-state"], reason = "the foundation sits below every nova-sim crate and is reached through the nova-sim facade" },
    { crate = "nova-sim-catalog", wrappers = ["nova-sim", "nova-sim-state"], reason = "the catalog layer sits below every nova-sim crate but the foundation and is reached through the nova-sim facade" },
    { crate = "nova-sim-state", wrappers = ["nova-sim"], reason = "the state layer sits on the foundation and the catalog, below every other nova-sim crate, and is reached through the nova-sim facade" },
]
