# cargo-deny's `bans` check (`mise run deny`) over the dependency graph that
# the default features resolve: what a release build links, read from Cargo's
# resolver rather than from any binary.
[graph]
all-features = false
no-default-features = false

[bans]
# Only the crates denied below matter here; duplicate versions are fine.
multiple-versions = "allow"
deny = [
    # The developer tools overlay is opt-in (nova's `dev-tools` feature):
    # egui must never be in the default build.
    { crate = "egui", reason = "only nova's dev-tools feature may pull in egui" },
    { crate = "egui-wgpu", reason = "only nova's dev-tools feature may pull in egui" },
    { crate = "egui-winit", reason = "only nova's dev-tools feature may pull in egui" },
    # MetalFX is reached only through nova-metalfx's safe API, and that
    # only from the renderer (a macOS-only dependency of each).
    { crate = "nova-metalfx", wrappers = ["nova-render"], reason = "only the renderer draws the world with MetalFX" },
    { crate = "objc2-metal-fx", wrappers = ["nova-metalfx"], reason = "MetalFX's unsafe bindings are reached only through nova-metalfx's safe API" },
    # The macOS menu bar and the Apple event handlers are built only through
    # nova-appkit's safe API, and that only by the game itself (a
    # macOS-only dependency of nova). The
    # ban on AppKit's bindings is about workspace crates: two third-party
    # crates in the default build bind AppKit themselves, winit for the
    # windowing and rfd for the startup dialogs (the open panel and the
    # alerts, a dependency of nova on macOS, Windows and Linux; only its
    # macOS backend binds AppKit). (Cargo.lock also lists
    # objc2-link-presentation as depending on them, but only through a
    # feature the default build leaves off, so it is not in this graph.)
    { crate = "nova-appkit", wrappers = ["nova"], reason = "only the game installs the macOS menu bar and its Apple event handlers" },
    { crate = "objc2-app-kit", wrappers = ["nova-appkit", "rfd", "winit"], reason = "AppKit's unsafe bindings are reached, among workspace crates, only through nova-appkit's safe API" },
    # rfd: the game's startup dialogs on macOS, Windows and Linux (the
    # XDG portal and zenity there).
    { crate = "rfd", wrappers = ["nova"], reason = "only the game asks for its data and shows startup errors in a dialog" },
    # Win32's console calls are made only through nova-win32's safe API,
    # and that only by the game (a Windows-only dependency of nova).
    { crate = "nova-win32", wrappers = ["nova"], reason = "Win32's unsafe calls are reached only through nova-win32's safe API, and only by the game" },
    # The workspace's layering, bottom to top:
    #
    # - nova-rsrc and nova-sim-base (no workspace dependencies);
    # - nova-data (on nova-rsrc);
    # - the layered nova-sim crates (roadmap nova-sim-layered-crates):
    #   catalog, state, combat, ai, story, port;
    # - nova-sim (the facade);
    # - nova-view;
    # - nova-render, nova-audio and nova-movie;
    # - nova.
    #
    # The platform shims are each reached only by their owner: nova-metalfx
    # (nova-render, macOS), nova-appkit (nova, macOS), nova-win32 (nova,
    # Windows) and nova-winres (nova's build script and Windows build, and
    # nova-bundle). The leaf tools nova-dump (on nova-rsrc and nova-data)
    # and nova-bundle (on nova-winres) have no dependents, so no entry.
    #
    # Each entry's `wrappers` is exactly the crate's direct dependents
    # (normal, dev and build, on every target), including the crate itself
    # when its tests turn on its own `fixture` or `recording`. A lower crate
    # is never in a higher crate's list, so it can't depend on it, not even
    # as a dev-dependency, which Cargo itself allows. A new edge means
    # adding the dependent to the list; a removed edge means deleting it
    # (`mise run deny` makes an unused wrapper an error). A new crate gets
    # its own entry and is added to the `wrappers` of every crate it uses.
    { crate = "nova-rsrc", wrappers = ["nova", "nova-audio", "nova-data", "nova-dump", "nova-render", "nova-rsrc", "nova-sim", "nova-sim-catalog", "nova-view"], reason = "the resource-fork reader sits at the bottom and is reached only by the crates that read the game's files" },
    { crate = "nova-data", wrappers = ["nova", "nova-audio", "nova-data", "nova-dump", "nova-render", "nova-sim", "nova-sim-catalog", "nova-sim-state", "nova-view"], reason = "the game data sits on nova-rsrc, below the nova-sim layers and everything above them" },
    { crate = "nova-view", wrappers = ["nova", "nova-audio", "nova-movie", "nova-render", "nova-view"], reason = "the view sits on the nova-sim facade, below the renderer, the audio and the game" },
    { crate = "nova-render", wrappers = ["nova", "nova-render"], reason = "only the game draws through the renderer" },
    { crate = "nova-audio", wrappers = ["nova", "nova-audio"], reason = "only the game plays sound through the audio crate" },
    { crate = "nova-movie", wrappers = ["nova"], reason = "only the game plays movies through the decoder" },
    { crate = "nova", wrappers = ["nova"], reason = "nothing but the game's own tests depends on the game" },
    { crate = "nova-winres", wrappers = ["nova", "nova-bundle"], reason = "the Windows resources are built only for the game and the bundler" },
    # The headed third-party crates: only the crates that own them may
    # depend on them directly, so a nova-sim or nova-view crate can't open a
    # window, draw or play sound. (This replaces a test that scanned
    # nova-sim's Cargo.toml.) cargo-deny has no globs, so each crate is
    # named. egui, egui-wgpu and egui-winit keep their outright bans above:
    # they already reject egui from any crate in the default build, and a
    # `wrappers` form would name crates not in this graph.
    { crate = "wgpu", wrappers = ["glyphon", "nova", "nova-metalfx", "nova-render"], reason = "only the renderer, its MetalFX shim, its text crate and the game reach the GPU" },
    { crate = "winit", wrappers = ["nova"], reason = "only the game opens a window" },
    { crate = "glyphon", wrappers = ["nova-render"], reason = "only the renderer draws text" },
    { crate = "kira", wrappers = ["nova-audio"], reason = "only the audio crate plays sound" },
    # FFmpeg's unsafe bindings are reached only through ffmpeg-next's safe
    # API, and that only by the movie decoder.
    { crate = "ffmpeg-next", wrappers = ["nova-movie"], reason = "FFmpeg is reached only through the movie decoder" },
    { crate = "ffmpeg-sys-next", wrappers = ["ffmpeg-next"], reason = "FFmpeg's bindings are reached only through ffmpeg-next" },
    { crate = "nova-sim", wrappers = ["nova", "nova-sim", "nova-view"], reason = "a layered nova-sim crate must never depend on the facade above it" },
    { crate = "nova-sim-base", wrappers = ["nova-sim", "nova-sim-ai", "nova-sim-catalog", "nova-sim-combat", "nova-sim-port", "nova-sim-state", "nova-sim-story"], reason = "the foundation sits below every nova-sim crate and is reached through the nova-sim facade" },
    { crate = "nova-sim-catalog", wrappers = ["nova-sim", "nova-sim-ai", "nova-sim-combat", "nova-sim-port", "nova-sim-state", "nova-sim-story"], reason = "the catalog layer sits below every nova-sim crate but the foundation and is reached through the nova-sim facade" },
    { crate = "nova-sim-state", wrappers = ["nova-sim", "nova-sim-ai", "nova-sim-combat", "nova-sim-port", "nova-sim-story"], reason = "the state layer sits on the foundation and the catalog, below every other nova-sim crate, and is reached through the nova-sim facade" },
    { crate = "nova-sim-combat", wrappers = ["nova-sim", "nova-sim-ai", "nova-sim-port", "nova-sim-story"], reason = "the combat layer sits on the foundation, the catalog and the state, below the ai, story, port and session layers, and is reached through the nova-sim facade" },
    { crate = "nova-sim-ai", wrappers = ["nova-sim", "nova-sim-port", "nova-sim-story"], reason = "the ai and traffic layer sits on the foundation, the catalog, the state and combat, below the story, port and session layers, and is reached through the nova-sim facade" },
    { crate = "nova-sim-story", wrappers = ["nova-sim", "nova-sim-port"], reason = "the story layer sits on the foundation, the catalog, the state, combat and the ai, below the port and session layers, and is reached through the nova-sim facade" },
    { crate = "nova-sim-port", wrappers = ["nova-sim"], reason = "the port layer sits on the foundation, the catalog, the state, combat, the ai and the story, below the session layer, and is reached through the nova-sim facade" },
]
