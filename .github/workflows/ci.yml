name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Runs ci and the build legs (not publish) on any branch, e.g. to try a
  # release build from a phase branch: gh workflow run ci.yml --ref <branch>
  # Only main reaches the macos-signing environment, so once the
  # repository-level signing secrets are deleted (infra/github/README.md,
  # cut-over) a branch dispatch signs ad-hoc.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # macOS covers the resource-fork (`..namedfork/rsrc`) adapter tests,
    # which are compiled only on that target; Windows covers the non-unix
    # paths.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Never auto-install the other mise.toml tools: shims would build them
      # from source (and on Windows each shim call re-enters mise to do it).
      MISE_AUTO_INSTALL: "false"
      # Report every failing test, not just the first (.config/nextest.toml).
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@v5
      # nova-audio plays through cpal, which builds against ALSA on Linux.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: jdx/mise-action@v5
        with:
          install: false
      # cargo-binstall on PATH lets mise install the cargo-backed tools as
      # prebuilt binaries. It's installed outside mise because on Windows the
      # mise shim for it re-enters mise, which installs every mise.toml tool
      # and deadlocks on the outer install's lock.
      - uses: cargo-bins/cargo-binstall@main
      # Only what `mise run ci` needs.
      - run: mise install rust cargo:cargo-nextest cargo:cargo-deny
        shell: bash
      # Save even when tests fail, so a red leg still moves the cache to the
      # current Cargo.lock. Save only from main: caches saved under a PR's
      # refs/pull/N/merge are invisible to main, but PRs can still restore
      # main's.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: mise run ci
        shell: bash

  # infra/github's structural checks: tofu fmt, validate and the
  # mocked-provider tests. It gets no secrets, no GITHUB_TOKEN and no OP_*
  # variables, and needs the network only for `tofu init` to download the
  # pinned providers. The dummy state passphrase lives in the infra-check
  # task itself; no state exists here, so it protects nothing. Nothing
  # `needs` this job, and the live plan/apply never runs in CI.
  infra:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MISE_AUTO_INSTALL: "false"
    steps:
      # Don't leave the job's token in .git/config: nothing here pushes.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          install: false
      - run: mise install opentofu
      - run: mise run infra-check

  # Release builds of `nova` and `nova-dump` for the rolling `nightly`
  # prerelease, on pushes to main and on manual dispatches (which `publish`
  # skips), after the `ci` gate. The `ci` Windows
  # leg is continue-on-error (rdm task windows-path-portable-tests), so a red
  # Windows test leg doesn't stop this job: the Windows archive ships as long
  # as its own release build succeeds. Revisit once Windows CI is a hard gate.
  build:
    needs: ci
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    strategy:
      # So every platform's build failure is reported in one run.
      fail-fast: false
      matrix:
        include:
          - name: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Nova.app for Apple silicon, in a .dmg: `mise run bundle` builds
          # on the arm64 runner and packs the bundle (crates/nova-bundle).
          # It signs with Developer ID and notarizes when the signing
          # secrets are set, ad-hoc otherwise. Intel Macs are not supported.
          - name: aarch64-apple-darwin
            os: macos-latest
            target: aarch64-apple-darwin
          - name: x86_64-pc-windows-msvc
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    # The signing secrets live in the macos-signing environment, whose
    # deployment-branch policy allows only main (infra/github/signing.tf).
    # Only main's macOS leg enters it. Every other leg, and every other
    # branch, names no environment and so still runs: a job that names an
    # environment its branch can't deploy to never starts. The expression must
    # never name anything but macos-signing, because naming an environment
    # that doesn't exist creates it, with no protection rules.
    environment: ${{ github.ref == 'refs/heads/main' && matrix.os == 'macos-latest' && 'macos-signing' || '' }}
    env:
      # As in `ci`: install only the Rust toolchain.
      MISE_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@v5
      # nova-audio plays through cpal, which builds against ALSA on Linux.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: jdx/mise-action@v5
        with:
          install: false
      - run: mise install rust
        shell: bash
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # Default features only: never --features dev-tools or --all-features,
      # so egui stays out of published builds. The release build must stay on
      # the same default feature set that `mise run deny` checks in `ci`.
      # The macOS leg's bundler builds its target itself, with the same
      # flags.
      - name: Build
        if: runner.os != 'macOS'
        shell: bash
        run: cargo build --release --locked -p nova -p nova-dump --target "${{ matrix.target }}"
      # ev-nova-aarch64-apple-darwin.dmg, holding Nova.app, nova-dump,
      # README.txt, LICENSE and an Applications link. The bundler stages
      # under target/, so dist/ holds only the .dmg. No game data. It signs
      # with Developer ID and notarizes when the signing secrets are set,
      # ad-hoc otherwise; the secrets reach this step alone, as the
      # variables the bundler reads. On main they come from the
      # macos-signing environment, whose secrets override repository secrets
      # of the same name. Elsewhere they come from the repository-level
      # copies until the cut-over deletes them, and then they are empty.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: mise run bundle -- dist
      # The signing seam (rdm phase
      # windows-platform-cross-roadmap/phase-2-sign-windows-builds-in-ci):
      # sign target/x86_64-pc-windows-msvc/release's nova.exe and
      # nova-dump.exe here, between the Build above and the packing below,
      # which takes the executables as they are and never rebuilds them.
      # WiX v5, pinned: v6 and later need an Open Source Maintenance Fee
      # EULA flag.
      - name: Install WiX (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      # ev-nova-x86_64-pc-windows-msvc.msi, the per-user installer, beside
      # the zip in dist/; it stages under target/. A second pack of the same
      # executables (the same version, a new ProductCode) is the "older"
      # build the installer test upgrades from.
      - name: Package (Windows installer)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mise run pack-installer -- --exes target/x86_64-pc-windows-msvc/release dist
          mise run pack-installer -- --exes target/x86_64-pc-windows-msvc/release target/installer/previous
      # The same phase signs dist/'s .msi here, before it is tested and
      # uploaded.
      # Installs, upgrades and uninstalls the .msi for real
      # (crates/nova-bundle/tests/it/windows_installer.rs); without NOVA_MSI
      # that test skips.
      - name: Test the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:NOVA_MSI = (Resolve-Path dist\ev-nova-x86_64-pc-windows-msvc.msi).Path
          $env:NOVA_MSI_PREVIOUS = (Resolve-Path target\installer\previous\ev-nova-x86_64-pc-windows-msvc.msi).Path
          cargo test --locked -p nova-bundle --test it windows_installer -- --nocapture
      # One top-level directory holding the two binaries, README.txt and
      # LICENSE. No game data.
      - name: Package
        if: runner.os != 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          name="ev-nova-${{ matrix.name }}"
          release="target/${{ matrix.target }}/release"
          mkdir -p "dist/$name"
          case "${{ matrix.os }}" in
            windows-*)
              cp "$release/nova.exe" "$release/nova-dump.exe" "dist/$name/"
              ;;
            *)
              cp "$release/nova" "$release/nova-dump" "dist/$name/"
              ;;
          esac
          cp packaging/README.txt LICENSE "dist/$name/"
          cd dist
          case "${{ matrix.os }}" in
            windows-*) 7z a "$name.zip" "$name" ;;
            *) tar czf "$name.tar.gz" "$name" ;;
          esac
          rm -rf "$name"
      # Only a hand-off to `publish`.
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  # Moves the `nightly` tag to this commit and replaces the prerelease's
  # assets. All or nothing: it needs every `build` leg, so a failed leg on
  # any platform skips publishing and leaves the previous nightly untouched.
  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # On top of the workflow-level group, so two quick pushes can't race on
    # the tag or the assets. A cancelled older run is harmless: the newer run
    # re-uploads every asset.
    concurrency:
      group: nightly-release
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      # Every build leg's dist/ is merged into dist/ above, so dist/ holds
      # every asset this run made. --clobber replaces each one in place;
      # then any asset not in dist/ (a renamed or dropped one, such as the
      # macOS tarball the .dmg replaced) is deleted. Uploading first means
      # the release is never without an asset this run makes.
      - name: Publish the nightly prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag -f nightly "$GITHUB_SHA"
          git push -f origin nightly
          commit_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
          notes="Tester build of \`main\` at $GITHUB_SHA ($commit_url).

          No EV Nova game data is included: supply your own \`Nova Files\` directory. See README.txt in each download for how to run the game."
          gh release view nightly >/dev/null 2>&1 ||
            gh release create nightly --prerelease --title "Nightly build" --notes "$notes"
          gh release edit nightly --prerelease --notes "$notes"
          gh release upload nightly dist/* --clobber
          gh release view nightly --json assets --jq '.assets[].name' |
            while IFS= read -r asset; do
              if [ ! -e "dist/$asset" ]; then
                gh release delete-asset nightly "$asset" --yes
              fi
            done
