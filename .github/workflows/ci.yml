name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # macOS covers the resource-fork (`..namedfork/rsrc`) adapter tests,
    # which are compiled only on that target; Windows covers the non-unix
    # paths.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Don't let `mise run` build the other mise.toml tools from source.
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v5
        with:
          install: false
      # cargo-binstall on PATH lets mise install the cargo-backed tools as
      # prebuilt binaries. It's installed outside mise because on Windows the
      # mise shim for it re-enters mise, which installs every mise.toml tool
      # and deadlocks on the outer install's lock.
      - uses: cargo-bins/cargo-binstall@main
      # Only what `mise run ci` needs.
      - run: mise install rust cargo:cargo-nextest
        shell: bash
      - uses: Swatinem/rust-cache@v2
      - run: mise run ci
        shell: bash
