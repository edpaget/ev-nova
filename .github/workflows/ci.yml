name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Runs ci and the build legs (never the release) on any branch, e.g. to
  # try a release build from a phase branch: gh workflow run ci.yml --ref
  # <branch>. Add -f channel=beta to build and test the beta packaging (the
  # build legs with NOVA_CHANNEL=beta; the Flatpak stays the nightly's,
  # since a beta Flatpak is never built, only promoted). Only main reaches
  # the macos-signing environment, so once the repository-level signing
  # secrets are deleted (infra/github/README.md, cut-over) a branch dispatch
  # signs ad-hoc.
  workflow_dispatch:
    inputs:
      channel:
        description: The channel the build legs package for (NOVA_CHANNEL). A dispatch never publishes.
        type: choice
        options: [nightly, beta]
        default: nightly

# Each ref's runs share a group of this workflow alone. GitHub keeps at most
# one pending run per group and cancels an older pending one when a newer
# one queues, so a newer push always supersedes an older push's pending
# run. Pull requests and other branches also cancel the older run in
# progress. On main a running run is never cancelled, because its `release`
# job may be publishing and must never be cut off: a burst of pushes queues
# one run behind the running one rather than many, and main's newest commit
# always gets its tests and its nightly. promote-beta.yml is never in this
# group, so a promotion can never cancel a push's tests or builds; the two
# meet only in `release`'s job-level group, below, where a running
# promotion can at most delay a nightly's release (and the next push's
# run, queued behind it).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    # macOS covers the resource-fork (`..namedfork/rsrc`) adapter tests,
    # which are compiled only on that target; Windows covers the non-unix
    # paths. Linux runs the whole gate. The other two run `ci-platform`,
    # just the steps that build their own `cfg` code (mise.toml says why).
    strategy:
      fail-fast: false
      matrix:
        # Runner images are pinned by name in every workflow, so an image
        # change is a reviewed diff. Ubuntu stays on 24.04 until a run on
        # ubuntu-26.04 passes.
        include:
          - os: ubuntu-24.04
            task: ci
          - os: macos-26
            task: ci-platform
          - os: windows-2025
            task: ci-platform
    runs-on: ${{ matrix.os }}
    env:
      # Never auto-install the other mise.toml tools: shims would build them
      # from source (and on Windows each shim call re-enters mise to do it).
      MISE_AUTO_INSTALL: "false"
      # Report every failing test, not just the first (.config/nextest.toml).
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # nova-audio plays through cpal, which builds against ALSA on Linux.
      # desktop-file-utils and appstream are the validators the Linux
      # desktop file and metainfo test runs (NOVA_LINUX_VALIDATORS below).
      # libclang-dev is for bindgen, which binds the FFmpeg nova-movie
      # builds (third_party/ffmpeg-sys-next).
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config desktop-file-utils appstream libclang-dev
      # FFmpeg's configure and make run in MSYS2 (preinstalled at
      # C:\msys64), with MSVC's compiler; bindgen uses the preinstalled
      # LLVM's libclang.
      - if: runner.os == 'Windows'
        run: C:\msys64\usr\bin\pacman.exe -Sy --noconfirm --needed make diffutils
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install: false
      # Only what `mise run ci` needs. nextest and cargo-deny come from
      # mise's aqua backend as prebuilt binaries (mise.toml). The cargo
      # backend's cargo-binstall timed out probing GitHub releases and fell
      # back to building both from source, which once cost the macOS leg 8
      # minutes.
      - run: mise install rust aqua:nextest-rs/nextest/cargo-nextest aqua:EmbarkStudios/cargo-deny
        shell: bash
      # Save even when tests fail, so a red leg still moves the cache to the
      # current Cargo.lock. Save only from main: caches saved under a PR's
      # refs/pull/N/merge are invisible to main, but PRs can still restore
      # main's.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The Linux leg runs the desktop file and metainfo through the
      # validators it installed (crates/nova-bundle/tests/it/linux_desktop.rs);
      # elsewhere the value is empty and that test skips.
      - run: mise run ${{ matrix.task }}
        shell: bash
        env:
          NOVA_LINUX_VALIDATORS: ${{ runner.os == 'Linux' && '1' || '' }}

  # infra/github's structural checks: tofu fmt, validate and the
  # mocked-provider tests. It gets no secrets, no GITHUB_TOKEN and no OP_*
  # variables, and needs the network only for `tofu init` to download the
  # pinned providers. The dummy state passphrase lives in the infra-check
  # task itself; no state exists here, so it protects nothing. Nothing
  # `needs` this job, and the live plan/apply never runs in CI.
  infra:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      MISE_AUTO_INSTALL: "false"
    steps:
      # Don't leave the job's token in .git/config: nothing here pushes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install: false
      - run: mise install opentofu
      - run: mise run infra-check

  # The run's build ID, HEAD's committer time in UTC as YYYYMMDDHHMMSS
  # (crates/nova-bundle/src/build_id.rs), computed once here and handed to
  # `build` and `flatpak` as NOVA_BUILD_ID, so every leg names the same
  # build. Reading it per leg would rely on each leg's checkout (in a
  # container, with git's safe.directory quirks) giving the same time.
  # `release` reads the same output. A promotion (promote-beta.yml) finds a
  # nightly's commit again by this time.
  build-id:
    needs: ci
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    env:
      MISE_AUTO_INSTALL: "false"
    outputs:
      id: ${{ steps.build-id.outputs.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install: false
      - run: mise install rust
      # Saved from main only, as in `ci`.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: build-id
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - id: build-id
        run: |
          set -euo pipefail
          id=$(mise run build-id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  # The release build legs (build.yml), for the rolling `nightly`
  # prerelease, on pushes to main and on manual dispatches (which
  # `release` skips), after the `ci` gate. A dispatch's channel input picks
  # the channel they package for; a push builds the nightly. Every leg,
  # its macos-signing gate and its hand-off are in build.yml.
  build:
    needs: [ci, build-id]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    uses: ./.github/workflows/build.yml
    with:
      build-id: ${{ needs.build-id.outputs.id }}
      channel: ${{ inputs.channel || 'nightly' }}
      ref: ${{ github.sha }}
    secrets: inherit

  # ev-nova-x86_64-unknown-linux-gnu.flatpak, built from vendored sources
  # on the freedesktop runtime by `mise run flatpak`
  # (crates/nova-bundle/src/linux/flatpak). On the runner itself, not in a
  # container: flatpak-builder sandboxes each build with bubblewrap, which
  # an unprivileged Docker container doesn't allow. Its binary is built in
  # the runtime's SDK, so the container's glibc floor doesn't apply.
  flatpak:
    needs: [ci, build-id]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    env:
      MISE_AUTO_INSTALL: "false"
      # As in `build`; the manifest passes it into the sandboxed build.
      NOVA_BUILD_ID: ${{ needs.build-id.outputs.id }}
      # The channel whose branch flatpak-builder exports onto
      # (crates/nova-bundle/src/linux/flatpak), and which the bundle and the
      # tests name: always the nightly, whatever a dispatch's channel input
      # says. A beta Flatpak is never built: a promotion copies the
      # nightly's commit onto the beta branch (release.yml's flatpak-repo),
      # which the repo test below does for real. A dispatched branch build is
      # the build main would make, and is never published.
      NOVA_CHANNEL: nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # xvfb gives the installed app's zenity a display for the test.
      # ostree is for the Flatpak repo test, which publishes this bundle
      # into a repo of its own.
      - run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder desktop-file-utils xvfb ostree
      # Ubuntu 24.04 restricts unprivileged user namespaces through
      # AppArmor, which bubblewrap needs for every build and run sandbox.
      - name: Allow bubblewrap's user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # flatpak-builder installs the runtime, SDK and Rust extension from
      # this remote (--install-deps-from=flathub --user).
      - run: flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install: false
      - run: mise install rust
      # Saved from main only, as in `ci`.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: flatpak
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Package (Flatpak)
        run: mise run flatpak -- dist
      # Installs the bundle with --user into a home the test owns, checks
      # its branch, permissions, zenity and exports
      # (crates/nova-bundle/tests/it/linux_flatpak.rs). The repo test
      # (linux_flatpak_repo.rs) publishes it with nova-flatpak-repo's stage
      # and sign into a repo the test owns, signed with a throwaway key and
      # served from 127.0.0.1, then installs, updates and prunes it, and
      # installs the bundle sign builds; then it promotes nightly builds onto
      # beta, installs the beta .flatpakref and follows a second promotion,
      # and checks a later nightly keeps the beta branch. gpg_repo_key.rs
      # checks the key checks against the real gpg. Without NOVA_FLATPAK and
      # NOVA_GPG those tests skip.
      - name: Test the Flatpak
        run: |
          NOVA_FLATPAK="$PWD/dist/ev-nova-x86_64-unknown-linux-gnu.flatpak" NOVA_GPG=1 \
            xvfb-run -a cargo test --locked -p nova-bundle --test it -- --nocapture linux_flatpak gpg_repo_key
      # The hand-off to release.yml's `publish`, which ships this plain
      # bundle unless its `flatpak-repo` replaces it with the
      # repo-following one.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-x86_64-unknown-linux-gnu-flatpak
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  # Publishes the nightly (release.yml): the Flatpak repo's nightly branch,
  # the `nightly` tag moved to this commit, the prerelease's assets and
  # signed update feeds, then the Pages site. On pushes to main only, after
  # every build leg and the Flatpak, so a failed leg on any platform
  # publishes nothing. The job grants the most any release job needs; each
  # job there narrows it, and its gates (update-signing, github-pages) are
  # in release.yml.
  #
  # Only this job is serialized with promotions: it shares the
  # `release-main` group with promote-beta.yml's `release`, never cancelled
  # in progress, because both read the live Flatpak repo from Pages and then
  # replace the whole site, so two releases at once would let the later
  # deploy drop the other's new commit, or the whole beta branch. The group
  # holds for the whole of release.yml. A pending release here and a pending
  # promotion's release can displace each other (one pending job per group):
  # a displaced nightly is published by the next push, and a displaced
  # promotion is dispatched again. Neither ever touches the other's tests
  # or builds, which run outside the group. deployments: read is for
  # release.yml's wait on the last Pages deploy.
  release:
    needs: [ci, build-id, build, flatpak]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: release-main
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write
      deployments: read
    uses: ./.github/workflows/release.yml
    with:
      channel: nightly
      build-id: ${{ needs.build-id.outputs.id }}
      sha: ${{ github.sha }}
    secrets: inherit
