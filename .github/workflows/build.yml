name: Build

# The release build legs: `nova` and `nova-dump` for each platform,
# packed (the .dmg, the .msi and the portable archives) and tested, each
# leg's dist/ uploaded as dist-<name> for release.yml's `publish`. A
# reusable workflow, so the nightly (ci.yml) and a promotion
# (promote-beta.yml) run the very same legs, with only their inputs
# different.
#
# Its steps come from the caller's ref (main, for both callers that
# publish), and they build `ref`'s checkout. A promotion builds a nightly
# from up to KEEP_BUILDS (three) builds ago with today's steps, so a change
# here that needs a task, flag or file the older commit lacks breaks
# promoting those builds until they age out. That failure is loud and comes
# before anything is published.
#
# A called workflow sees the caller's github context, so `github.ref` below
# is the caller's ref: only a run on main (the nightly's push, or a
# promotion dispatched on main) enters macos-signing or windows-signing.
# Both callers grant the `build` job `id-token: write`, which a called
# workflow can only narrow.
on:
  workflow_call:
    inputs:
      build-id:
        description: The build ID every leg compiles in and stamps (NOVA_BUILD_ID).
        required: true
        type: string
      channel:
        description: The channel the builds name (NOVA_CHANNEL), nightly or beta.
        required: true
        type: string
      ref:
        description: The commit to check out and build.
        required: true
        type: string

jobs:
  # Release builds of `nova` and `nova-dump` for the rolling prerelease of
  # `channel`. The caller runs it after its `ci` gate, and every `ci` leg,
  # Windows included, is a hard gate: a red test leg on any platform stops
  # all three build legs, so nothing publishes. Gating stays on all three
  # because `needs:` names a job, not a matrix leg, and `release` waits on
  # every build leg anyway.
  build:
    strategy:
      # So every platform's build failure is reported in one run.
      fail-fast: false
      matrix:
        include:
          # Built in an ubuntu:24.04 container, so the tarball's binary
          # needs no glibc newer than 2.39, the floor packaging/README.txt
          # records. The pinned image keeps the floor fixed whatever runner
          # image hosts it. Older systems use the Flatpak, built in ci.yml's
          # `flatpak` job.
          - name: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            container: ubuntu:24.04
            target: x86_64-unknown-linux-gnu
          # Nova.app for Apple silicon, in a .dmg: `mise run bundle` builds
          # on the arm64 runner and packs the bundle (crates/nova-bundle).
          # It signs with Developer ID and notarizes when the signing
          # secrets are set, ad-hoc otherwise. Intel Macs are not supported.
          - name: aarch64-apple-darwin
            os: macos-26
            target: aarch64-apple-darwin
          - name: x86_64-pc-windows-msvc
            os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    # Only the Linux leg names one; empty, a leg runs on the runner itself.
    container: ${{ matrix.container }}
    # For azure/login's OIDC token on the Windows leg. It can't be granted
    # per matrix leg, and needn't be: Azure trusts only tokens whose subject
    # is the windows-signing environment (infra/windows-signing), which only
    # main's Windows leg enters.
    permissions:
      contents: read
      id-token: write
    # The macOS signing secrets live in the macos-signing environment
    # (infra/github/signing.tf), and the Windows signing variables in the
    # windows-signing environment (infra/windows-signing/github.tf). Each
    # one's deployment-branch policy allows only main. Only main's macOS leg
    # enters macos-signing, and only main's Windows leg windows-signing,
    # each picked by target rather than runner image so a runner bump can't
    # silently drop signing. Every other leg, and every other branch, names
    # no environment and so still runs: a job that names an environment its
    # branch can't deploy to never starts. The expression must only ever
    # produce macos-signing, windows-signing or '', each a literal, because
    # naming an environment that doesn't exist creates it, with no
    # protection rules.
    environment: ${{ github.ref == 'refs/heads/main' && matrix.name == 'aarch64-apple-darwin' && 'macos-signing' || github.ref == 'refs/heads/main' && matrix.name == 'x86_64-pc-windows-msvc' && 'windows-signing' || '' }}
    env:
      # As in ci.yml's `ci`: install only the Rust toolchain.
      MISE_AUTO_INSTALL: "false"
      # The run's one build ID, for every step: `cargo build` compiles it
      # into nova, and the bundlers stamp it on Info.plist and the
      # metainfo. A promotion passes its nightly's ID, so the beta build
      # carries the same one.
      NOVA_BUILD_ID: ${{ inputs.build-id }}
      # The channel the bundlers bake in (crates/nova-bundle/src/channel.rs):
      # Nova.app's Info.plist and nova.exe name its feed once the nova
      # package commits update_public_key. ci.yml passes nightly (or a
      # dispatch's channel input); promote-beta.yml passes beta.
      NOVA_CHANNEL: ${{ inputs.channel }}
    steps:
      # The container starts bare and as root (no sudo): a compiler for
      # rustup's toolchain and the C build scripts, git and curl for
      # checkout and mise, ALSA's headers (nova-audio plays through cpal,
      # which builds against ALSA on Linux), objdump (binutils) for the
      # tarball's glibc check, libclang for bindgen over the FFmpeg
      # nova-movie builds (curl and xz-utils fetch and unpack its source),
      # and libudev's headers for gilrs, nova's gamepads.
      - if: runner.os == 'Linux'
        run: |
          apt-get update
          # libasound2-dev keeps its name on 24.04; only the runtime package became libasound2t64.
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config libasound2-dev binutils git curl ca-certificates xz-utils libclang-dev libudev-dev
      # As in ci.yml: FFmpeg's configure and make run in MSYS2.
      - if: runner.os == 'Windows'
        run: C:\msys64\usr\bin\pacman.exe -Sy --noconfirm --needed make diffutils
      # The commit to build: the pushed one for the nightly, the nightly's
      # own commit for a promotion.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install: false
      - run: mise install rust
        shell: bash
      # Save only from main, as in ci.yml's `ci`. A branch dispatch still
      # restores main's cache, but the caches it saved never reached main,
      # and their size pushed the repository past its 10 GB of Actions
      # cache, which evicts main's own. A promotion runs on main, so it saves.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The FFmpeg source tarball, as in ci.yml's `ci` job.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/nova-ffmpeg
          key: nova-ffmpeg-${{ runner.os }}-${{ hashFiles('third_party/ffmpeg-source.toml') }}
      # Default features only: never --features dev-tools or --all-features,
      # so egui stays out of published builds. The release build must stay on
      # the same default feature set that `mise run deny` checks in `ci`.
      # The macOS leg's bundler builds its target itself, with the same
      # flags. On Windows, nova's build script compiles NOVA_CHANNEL's
      # update feed into nova.exe (nova::winsparkle::FEED) once the nova
      # package commits update_public_key; until then it compiles in none,
      # and the game runs no updater.
      - name: Build
        if: runner.os != 'macOS'
        shell: bash
        run: cargo build --release --locked -p nova -p nova-dump --target "${{ matrix.target }}"
      # ev-nova-aarch64-apple-darwin.dmg, holding Nova.app (with Sparkle,
      # downloaded at its pinned version and checked, in
      # Contents/Frameworks, and the Noto fonts' licences, NotoSans-OFL.txt
      # and NotoSerif-OFL.txt, in Contents/Resources), nova-dump,
      # README.txt, LICENSE, the two font licences again and an
      # Applications link. The bundler stages under target/, so dist/ holds
      # only the .dmg. No game data. It signs with Developer ID, notarizes
      # and has Gatekeeper assess (spctl) the app and the .dmg when the
      # signing secrets are set, which is on main alone, and signs ad-hoc
      # otherwise; the secrets reach this step alone, as the
      # variables the bundler reads. On main they come from the
      # macos-signing environment, whose secrets override repository secrets
      # of the same name. Elsewhere they come from the repository-level
      # copies until the cut-over deletes them, and then they are empty.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: mise run bundle -- dist
      # The .dmg as built, mounted (crates/nova-bundle/tests/it/macos_dmg.rs:
      # the trimmed arm64 Sparkle, the signature, the channel's Info.plist),
      # and the staged Sparkle.framework loaded for real
      # (crates/nova-appkit/tests/it/updater.rs). Each skips without its
      # variable.
      - name: Test the dmg (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          NOVA_DMG="$PWD/dist/ev-nova-aarch64-apple-darwin.dmg" \
            cargo test --locked -p nova-bundle --test it macos_dmg -- --nocapture
          NOVA_SPARKLE_FRAMEWORKS="$PWD/target/bundle/staging/Nova.app/Contents/Frameworks" \
            cargo test --locked -p nova-appkit --test it updater
      # Signs in to Azure with the job's OIDC token, as the windows-signing
      # environment's service principal, which holds only the Artifact
      # Signing profile's signer role and no subscription role (hence
      # allow-no-subscriptions). The vars are empty outside that
      # environment, so a branch, pull request or fork skips it. Azure CLI
      # can't refresh the GitHub token it keeps as the client assertion,
      # which lasts minutes (Azure/login#372), so each signing step gets its
      # own login right before it. Its post step logs out.
      - name: Log in to Azure (Windows)
        if: runner.os == 'Windows' && vars.AZURE_CLIENT_ID != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true
      # Signs and verifies nova.exe and nova-dump.exe in place with
      # Artifact Signing (crates/nova-bundle/src/authenticode): signtool and
      # its dlib at pinned versions, SHA-256, Microsoft's timestamp server,
      # and `signtool verify /pa /tw`, which fails an untimestamped file.
      # The packing below and the zip take them as they are. Outside
      # windows-signing the three variables are empty, and it logs
      # "unsigned" and signs nothing.
      - name: Sign the executables (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: >-
          mise run sign-windows --
          target/x86_64-pc-windows-msvc/release/nova.exe
          target/x86_64-pc-windows-msvc/release/nova-dump.exe
      # WiX v5, pinned: v6 and later need an Open Source Maintenance Fee
      # EULA flag.
      - name: Install WiX (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      # A second pack of the same executables (the same version, a new
      # ProductCode): the "older" build the installer test upgrades from,
      # into target/installer/previous. Never signed (no signing
      # variables): it is only the test's. It packs first, so the dist pack
      # below is the last to stage WinSparkle.dll, the file the installer
      # test compares the installed DLL with. Each pack downloads WinSparkle
      # 0.9.4 into target/installer/downloads, checks the archive's and then
      # the DLL's SHA-256 with certutil, and lists WinSparkle.dll and its
      # two licences beside nova.exe
      # (crates/nova-bundle/src/installer/winsparkle.rs). It logs which
      # update feed the build names, from the same NOVA_CHANNEL and key the
      # Build's nova.exe compiled in, and that it is unsigned.
      - name: Package the previous installer (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: mise run pack-installer -- --exes target/x86_64-pc-windows-msvc/release target/installer/previous
      # A fresh login for the dist pack's signing (see the first one).
      - name: Log in to Azure again (Windows)
        if: runner.os == 'Windows' && vars.AZURE_CLIENT_ID != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true
      # ev-nova-x86_64-pc-windows-msvc.msi, the per-user installer, beside
      # the zip in dist/; it stages under target/. In windows-signing it
      # signs and verifies the staged WinSparkle.dll between its pin check
      # and wix build, and the .msi after wix build, as the executables
      # above (crates/nova-bundle/src/installer/plan.rs); elsewhere it logs
      # "unsigned".
      - name: Package the Windows installer
        if: runner.os == 'Windows'
        shell: bash
        env:
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: mise run pack-installer -- --exes target/x86_64-pc-windows-msvc/release dist
      # Installs, upgrades and uninstalls the .msi for real
      # (crates/nova-bundle/tests/it/windows_installer.rs), checking the
      # installed WinSparkle.dll is the one the last pack (dist's, signed on
      # main) staged; then loads that DLL for real
      # (crates/nova-win32/tests/it/winsparkle.rs). Without NOVA_MSI or
      # NOVA_WINSPARKLE_DLL each test skips.
      - name: Test the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:NOVA_MSI = (Resolve-Path dist\ev-nova-x86_64-pc-windows-msvc.msi).Path
          $env:NOVA_MSI_PREVIOUS = (Resolve-Path target\installer\previous\ev-nova-x86_64-pc-windows-msvc.msi).Path
          cargo test --locked -p nova-bundle --test it windows_installer -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:NOVA_WINSPARKLE_DLL = (Resolve-Path target\installer\downloads\WinSparkle.dll).Path
          cargo test --locked -p nova-win32 --test it winsparkle -- --nocapture
      # One top-level directory holding the two binaries, README.txt,
      # LICENSE and the fonts' licences (NotoSans-OFL.txt and
      # NotoSerif-OFL.txt, crates/nova-render/fonts), and on Linux the share/ tree (the desktop file, the
      # AppStream metainfo and the hicolor icons) to copy into
      # ~/.local/share. No game data. The directory's and the
      # archive's names come from nova-bundle (crates/nova-bundle/src/archive.rs),
      # the same constants the download page links; cargo is run directly,
      # not through mise, so stdout carries the name alone. The Windows zip
      # carries no WinSparkle.dll, so the portable copy doesn't update; its
      # executables are the ones signed above.
      - name: Package
        if: runner.os != 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          dir=$(cargo run --quiet --locked -p nova-bundle --bin nova-site -- --archive-dir "${{ matrix.target }}")
          file=$(cargo run --quiet --locked -p nova-bundle --bin nova-site -- --archive "${{ matrix.target }}")
          release="target/${{ matrix.target }}/release"
          mkdir -p "dist/$dir"
          case "${{ matrix.os }}" in
            windows-*)
              cp "$release/nova.exe" "$release/nova-dump.exe" "dist/$dir/"
              ;;
            *)
              cp "$release/nova" "$release/nova-dump" "dist/$dir/"
              ;;
          esac
          if [ "${{ runner.os }}" = Linux ]; then
            mise run linux-desktop -- "dist/$dir"
          fi
          cp packaging/README.txt LICENSE "dist/$dir/"
          cp crates/nova-render/fonts/OFL.txt "dist/$dir/NotoSans-OFL.txt"
          cp crates/nova-render/fonts/NotoSerif-OFL.txt "dist/$dir/NotoSerif-OFL.txt"
          cd dist
          case "${{ matrix.os }}" in
            windows-*) 7z a "$file" "$dir" ;;
            *) tar czf "$file" "$dir" ;;
          esac
          rm -rf "$dir"
      # Unpacks the tarball and checks its files and its binary's glibc
      # floor and libraries (crates/nova-bundle/tests/it/linux_tarball.rs);
      # without NOVA_TARBALL that test skips.
      - name: Test the tarball
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          file=$(cargo run --quiet --locked -p nova-bundle --bin nova-site -- --archive "${{ matrix.target }}")
          NOVA_TARBALL="$PWD/dist/$file" \
            cargo test --locked -p nova-bundle --test it linux_tarball -- --nocapture
      # Only a hand-off to release.yml's `publish`.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1
